name: Auto Release

# Release flow
# ------------
# 1. A PR is tested by ci.yml (once per PR update).
# 2. When the PR is merged into main and carries a release label (major / minor /
#    patch, or semver:*), this workflow bumps the version, stamps CHANGELOG.md,
#    builds the distribution, tags the commit and publishes the GitHub release.
#    It does NOT run the tests again: the PR already passed them. Keep branch
#    protection on "require branches to be up to date" so the merge result equals
#    the tested result.
# 3. A manual dispatch has no PR behind it, so it runs ci.yml first (job `test`).

on:
  pull_request_target:
    types: [closed]
    branches: [main, master]
  workflow_dispatch:
    inputs:
      bump_type:
        description: "Version component to bump"
        required: true
        default: "patch"
        type: choice
        options:
          - major
          - minor
          - patch
      prerelease:
        description: "Prerelease type (none = stable release)"
        required: true
        default: "none"
        type: choice
        options:
          - none
          - a
          - b
          - rc
      prerelease_number:
        description: "Prerelease number (only used when prerelease != none)"
        required: false
        default: "1"

# ── Project-specific ──────────────────────────────────────────────────────────
# List every file that stores the version string, one per line.
# Supported extensions: .toml (version = "x.y.z")
#                       .py   (__version__ = "x.y.z")
#                       .json (first "version" key, at any depth)
# CHANGELOG_FILE is stamped with the new version (Keep a Changelog format).
env:
  VERSION_FILES: |
    pyproject.toml
    gmcounter/__init__.py
    gmcounter/config.json
  CHANGELOG_FILE: CHANGELOG.md

permissions:
  contents: read

concurrency:
  group: auto-release
  cancel-in-progress: false

jobs:
  # Only for manual releases; a merged PR was already tested by ci.yml.
  test:
    name: Test (manual release only)
    if: github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/ci.yml

  release:
    name: Bump version and release
    needs: test
    # `test` is skipped for merged PRs; that must not skip the release.
    if: >-
      !cancelled()
      && needs.test.result != 'failure'
      && needs.test.result != 'cancelled'
      && (github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true)
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.base.ref || 'main' }}
          token: ${{ secrets.PAT_TOKEN || github.token }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Determine bump type
        id: bump
        env:
          PR_LABELS_JSON: ${{ toJson(github.event.pull_request.labels.*.name) }}
          INPUT_BUMP: ${{ inputs.bump_type }}
          INPUT_PRERELEASE: ${{ inputs.prerelease }}
          INPUT_PRERELEASE_NUMBER: ${{ inputs.prerelease_number }}
        run: |
          python - <<'PYEOF'
          from __future__ import annotations
          import json
          import os
          import re

          event = os.environ["GITHUB_EVENT_NAME"]

          if event == "workflow_dispatch":
              bump = os.environ["INPUT_BUMP"]
              prerelease = os.environ["INPUT_PRERELEASE"]
              prerelease_number = os.environ["INPUT_PRERELEASE_NUMBER"] or "1"
              if not re.fullmatch(r"\d+", prerelease_number):
                  raise SystemExit(f"prerelease_number must be a number, got {prerelease_number!r}")
              should_release = "true"
              print(f"Manual dispatch: bump={bump}, prerelease={prerelease}")
          else:
              labels = [l.lower() for l in json.loads(os.environ.get("PR_LABELS_JSON") or "[]")]
              found = set()
              for label in labels:
                  name = label.split(":", 1)[-1]  # accepts semver:major, release:major, bump:major
                  if name in ("major", "minor", "patch"):
                      found.add(name)
              # Several labels: the highest level wins.
              bump = next((l for l in ("major", "minor", "patch") if l in found), "")
              prerelease = "none"
              prerelease_number = "1"
              should_release = "true" if bump else "false"
              print(f"PR labels: {labels}")
              print(f"Detected bump: {bump or '(none - skipping release)'}")

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
              f.write(f"bump_type={bump}\n")
              f.write(f"prerelease={prerelease}\n")
              f.write(f"prerelease_number={prerelease_number}\n")
              f.write(f"should_release={should_release}\n")
          PYEOF

      - name: No release label - skip
        if: steps.bump.outputs.should_release != 'true'
        run: |
          echo "No release label on the merged PR - nothing released." >> $GITHUB_STEP_SUMMARY
          echo "Add one of: major, minor, patch (or semver:major/minor/patch) to trigger a release." >> $GITHUB_STEP_SUMMARY

      - name: Compute new version
        if: steps.bump.outputs.should_release == 'true'
        id: ver
        env:
          BUMP: ${{ steps.bump.outputs.bump_type }}
          PRERELEASE: ${{ steps.bump.outputs.prerelease }}
          PRERELEASE_NUMBER: ${{ steps.bump.outputs.prerelease_number }}
        run: |
          python - <<'PYEOF'
          from __future__ import annotations
          import os
          import re
          from pathlib import Path

          bump = os.environ["BUMP"]
          prerelease = os.environ["PRERELEASE"]
          prerelease_number = os.environ["PRERELEASE_NUMBER"]

          m = re.search(r'^version\s*=\s*"([^"]+)"$', Path("pyproject.toml").read_text(encoding="utf-8"), re.MULTILINE)
          if not m:
              raise RuntimeError("Could not find version in pyproject.toml")
          current = m.group(1)

          base = re.sub(r"(?:a|b|rc)\d+$", "", current)
          major, minor, patch = (int(p) for p in base.split("."))

          if bump == "major":
              major += 1; minor = 0; patch = 0
          elif bump == "minor":
              minor += 1; patch = 0
          else:
              patch += 1

          new_version = f"{major}.{minor}.{patch}"
          if prerelease != "none":
              new_version = f"{new_version}{prerelease}{prerelease_number}"

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
              f.write(f"current_version={current}\n")
              f.write(f"new_version={new_version}\n")

          print(f"Current: {current}  ->  New: {new_version}")
          PYEOF

      - name: Update version files
        if: steps.bump.outputs.should_release == 'true'
        env:
          VERSION: ${{ steps.ver.outputs.new_version }}
        run: |
          python - <<'PYEOF'
          from __future__ import annotations
          import json
          import os
          import re
          from pathlib import Path

          version = os.environ["VERSION"]
          targets = [Path(line.strip()) for line in os.environ["VERSION_FILES"].splitlines() if line.strip()]

          def has_version(payload) -> bool:
              if isinstance(payload, dict):
                  return "version" in payload or any(has_version(v) for v in payload.values())
              return False

          for target in targets:
              if not target.exists():
                  raise RuntimeError(f"Missing version target: {target}")
              text = target.read_text(encoding="utf-8")
              if target.suffix == ".toml":
                  updated, n = re.subn(r'^version\s*=\s*"[^"]*"$', f'version = "{version}"', text, count=1, flags=re.MULTILINE)
              elif target.suffix == ".py":
                  updated, n = re.subn(r'^__version__\s*=\s*"[^"]*"$', f'__version__ = "{version}"', text, count=1, flags=re.MULTILINE)
              elif target.suffix == ".json":
                  # Replace the value in place: re-dumping the JSON would reformat the
                  # whole file (config.json is hand-formatted and carries comment keys).
                  if not has_version(json.loads(text)):
                      raise RuntimeError(f"No 'version' field in {target}")
                  updated, n = re.subn(r'("version"\s*:\s*")[^"]*(")', rf'\g<1>{version}\g<2>', text, count=1)
                  json.loads(updated)  # still valid
              else:
                  raise RuntimeError(f"Unsupported file type: {target}")
              if n != 1:
                  raise RuntimeError(f"Could not update version in {target}")
              target.write_text(updated, encoding="utf-8")
              print(f"{target}: {version}")
          PYEOF

      - name: Stamp changelog
        if: steps.bump.outputs.should_release == 'true'
        id: changelog
        env:
          VERSION: ${{ steps.ver.outputs.new_version }}
        run: |
          python - <<'PYEOF'
          from __future__ import annotations
          import datetime
          import os
          import re
          from pathlib import Path

          version = os.environ["VERSION"]
          path = Path(os.environ["CHANGELOG_FILE"])
          notes_path = Path(os.environ["RUNNER_TEMP"]) / "release_notes.md"
          notes = ""

          if path.exists():
              text = path.read_text(encoding="utf-8")
              m = re.search(r"^## \[Unreleased\][^\n]*\n(.*?)(?=^## \[|\Z)", text, re.MULTILINE | re.DOTALL)
              if m and m.group(1).strip():
                  notes = m.group(1).strip()
                  today = datetime.date.today().isoformat()
                  stamped = f"## [Unreleased]\n\n## [{version}] - {today}\n\n{notes}\n\n"
                  path.write_text(text[: m.start()] + stamped + text[m.end():], encoding="utf-8")
                  print(f"Stamped {path} with {version} ({len(notes.splitlines())} lines)")
              else:
                  print(f"::warning::No entries under '## [Unreleased]' in {path}; the release uses generated notes")
          else:
              print(f"::warning::{path} not found; the release uses generated notes")

          notes_path.write_text(notes + ("\n" if notes else ""), encoding="utf-8")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
              f.write(f"has_notes={'true' if notes else 'false'}\n")
              f.write(f"notes_path={notes_path}\n")
          PYEOF

      - name: Build wheel and sdist
        if: steps.bump.outputs.should_release == 'true'
        run: |
          python -m pip install build twine
          python -m build
          twine check dist/*

      - name: Check the wheel
        if: steps.bump.outputs.should_release == 'true'
        run: |
          python - <<'PYEOF'
          import glob
          import zipfile

          wheels = glob.glob("dist/*.whl")
          assert len(wheels) == 1, f"expected one wheel, found {wheels}"
          names = zipfile.ZipFile(wheels[0]).namelist()
          assert any(n.endswith("gmcounter/config.json") for n in names), "config.json missing from the wheel"
          assert any(n.endswith("pyqt/main_window.ui") for n in names), "Designer forms missing from the wheel"
          assert not any("/mocks/" in n for n in names), "mocks must not ship in the wheel"
          print("wheel ok:", wheels[0], f"({len(names)} files)")
          PYEOF

      - name: Detect prerelease
        if: steps.bump.outputs.should_release == 'true'
        id: pre
        env:
          VERSION: ${{ steps.ver.outputs.new_version }}
        run: |
          if echo "$VERSION" | grep -qE '(a|b|rc)[0-9]+$'; then
            echo "is_prerelease=true" >> $GITHUB_OUTPUT
          else
            echo "is_prerelease=false" >> $GITHUB_OUTPUT
          fi

      - name: Compose release notes
        if: steps.bump.outputs.should_release == 'true'
        id: notes
        env:
          VERSION: ${{ steps.ver.outputs.new_version }}
          NOTES_PATH: ${{ steps.changelog.outputs.notes_path }}
          REPO: ${{ github.repository }}
        run: |
          python - <<'PYEOF'
          import os
          from pathlib import Path

          version = os.environ["VERSION"]
          repo = os.environ["REPO"]
          notes = Path(os.environ["NOTES_PATH"]).read_text(encoding="utf-8").strip()
          out = Path(os.environ["RUNNER_TEMP"]) / "release_body.md"

          body = f"## GMCounter v{version}\n\n"
          if notes:
              body += notes + "\n\n"
          body += (
              "### Installation\n\n"
              "```bash\n"
              f"pip install git+https://github.com/{repo}.git@v{version}\n"
              "```\n\n"
              "### Launch\n\n"
              "```bash\n"
              "gmcounter                # hardware\n"
              "gmcounter --simulate     # simulated counter, no hardware\n"
              "```\n\n"
              f"See the [README](https://github.com/{repo}#readme) and the [changelog](https://github.com/{repo}/blob/v{version}/CHANGELOG.md).\n"
          )
          out.write_text(body, encoding="utf-8")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
              f.write(f"body_path={out}\n")
          PYEOF

      - name: Commit, tag, and push
        if: steps.bump.outputs.should_release == 'true'
        env:
          VERSION: ${{ steps.ver.outputs.new_version }}
          BASE_REF: ${{ github.event.pull_request.base.ref || 'main' }}
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          python - <<'PYEOF'
          import os, subprocess
          files = [f.strip() for f in os.environ["VERSION_FILES"].splitlines() if f.strip()]
          files.append(os.environ["CHANGELOG_FILE"])
          subprocess.run(["git", "add", "--"] + [f for f in files if os.path.exists(f)], check=True)
          PYEOF
          git commit -m "chore: bump version to v$VERSION"
          git tag "v$VERSION"
          # One atomic push: the branch and the tag land together or not at all.
          git push --atomic origin "HEAD:refs/heads/$BASE_REF" "refs/tags/v$VERSION"
          echo "Pushed commit and tag v$VERSION to $BASE_REF"

      - name: Create GitHub release
        if: steps.bump.outputs.should_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.new_version }}
          name: Release v${{ steps.ver.outputs.new_version }}
          prerelease: ${{ steps.pre.outputs.is_prerelease }}
          # The changelog section is the release text; GitHub's generated notes are
          # only added when the changelog had nothing under [Unreleased].
          generate_release_notes: ${{ steps.changelog.outputs.has_notes != 'true' }}
          body_path: ${{ steps.notes.outputs.body_path }}
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Summary
        if: steps.bump.outputs.should_release == 'true'
        env:
          VERSION: ${{ steps.ver.outputs.new_version }}
          BUMP: ${{ steps.bump.outputs.bump_type }}
          PRERELEASE: ${{ steps.pre.outputs.is_prerelease }}
          TRIGGER: ${{ github.event_name }}
          HAS_NOTES: ${{ steps.changelog.outputs.has_notes }}
        run: |
          echo "## Release Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Field | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| **Version** | \`v$VERSION\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Bump** | $BUMP |" >> $GITHUB_STEP_SUMMARY
          echo "| **Pre-release** | $PRERELEASE |" >> $GITHUB_STEP_SUMMARY
          echo "| **Trigger** | $TRIGGER |" >> $GITHUB_STEP_SUMMARY
          echo "| **Notes from changelog** | $HAS_NOTES |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          ls dist/ | while read f; do echo "- \`$f\`" >> $GITHUB_STEP_SUMMARY; done
